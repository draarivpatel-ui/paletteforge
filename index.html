<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PaletteForge</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <h1>PaletteForge</h1>
  <div class="top-actions">
    <button id="btn-theme" type="button">Dark room</button>
  </div>
</header>

<main class="layout">
  <section class="stage" aria-label="Poster preview">
    <figure class="frame">
      <canvas id="poster" width="1400" height="1800"></canvas>
    </figure>
    <div class="placard" id="placard">
      <span class="placard-title" id="placard-title">Untitled study</span>
      <span class="placard-meta" id="placard-meta"></span>
      <span class="placard-medium" id="placard-medium"></span>
    </div>
  </section>

  <section class="controls" aria-label="Studio controls">
    <div class="block actions">
      <button id="btn-surprise" type="button" class="primary">Surprise seed &amp; harmony</button>
      <div class="action-pair">
        <button id="btn-extract" type="button">Extract from sample art</button>
        <button id="btn-copy" type="button">Copy share link</button>
      </div>
      <div class="action-pair">
        <button id="btn-svg" type="button">Export SVG</button>
        <button id="btn-png" type="button">Export PNG</button>
      </div>
    </div>

    <div class="block">
      <h2>Seed and base</h2>
      <div class="seed-row">
        <input id="seed-input" type="text" maxlength="64" spellcheck="false" autocomplete="off" placeholder="any words become the artwork" aria-label="Seed text">
        <button id="btn-seed" type="button">Apply</button>
      </div>
      <div class="seed-row base-row">
        <input id="base-color" type="color" value="#c8451f" aria-label="Base color picker">
        <input id="base-hex" type="text" maxlength="9" spellcheck="false" autocomplete="off" placeholder="#c8451f" aria-label="Base color as hex" aria-describedby="color-note">
        <button id="btn-base" type="button">Base color</button>
      </div>
      <div class="seed-row">
        <input id="base-oklch" type="text" maxlength="40" spellcheck="false" autocomplete="off" placeholder="oklch(0.55 0.14 28)" aria-label="Base color as an OKLCH triple" aria-describedby="color-note">
        <button id="btn-oklch" type="button">OKLCH</button>
      </div>
      <p class="note" id="color-note"></p>
    </div>

    <div class="block">
      <h2>Composition</h2>
      <div class="btn-grid cols2" id="mode-group" role="radiogroup" aria-label="Composition mode">
        <button type="button" id="mode-flow" role="radio" aria-checked="false" data-mode="flow">Flow ribbons</button>
        <button type="button" id="mode-wallpaper" role="radio" aria-checked="false" data-mode="wallpaper">Wallpaper symmetry</button>
        <button type="button" id="mode-bauhaus" role="radio" aria-checked="false" data-mode="bauhaus">Bauhaus grid</button>
        <button type="button" id="mode-moire" role="radio" aria-checked="false" data-mode="moire">Moire superformula</button>
      </div>
      <div class="btn-grid cols3 subtle" id="symmetry-group" role="radiogroup" aria-label="Wallpaper symmetry group">
        <button type="button" id="sym-p4m" role="radio" aria-checked="false" data-symmetry="p4m" title="p4m wallpaper group">p4m</button>
        <button type="button" id="sym-p6m" role="radio" aria-checked="false" data-symmetry="p6m" title="p6m wallpaper group">p6m</button>
        <button type="button" id="sym-p2" role="radio" aria-checked="false" data-symmetry="p2" title="p2 wallpaper group">p2</button>
      </div>
    </div>

    <div class="block">
      <h2>Harmony</h2>
      <div class="btn-grid cols3" id="harmony-group" role="radiogroup" aria-label="Harmony mode">
        <button type="button" id="harm-complementary" role="radio" aria-checked="false" data-harmony="complementary">Complementary</button>
        <button type="button" id="harm-split-complementary" role="radio" aria-checked="false" data-harmony="split-complementary">Split comp</button>
        <button type="button" id="harm-triadic" role="radio" aria-checked="false" data-harmony="triadic">Triadic</button>
        <button type="button" id="harm-analogous" role="radio" aria-checked="false" data-harmony="analogous">Analogous</button>
        <button type="button" id="harm-tetradic" role="radio" aria-checked="false" data-harmony="tetradic">Tetradic</button>
        <button type="button" id="harm-monochromatic" role="radio" aria-checked="false" data-harmony="monochromatic">Mono tonal</button>
      </div>
      <p class="note" id="palette-source-note"></p>
    </div>

    <div class="block">
      <h2>Vision</h2>
      <div class="btn-grid cols2" id="cvd-group" role="radiogroup" aria-label="Color vision simulation">
        <button type="button" id="cvd-none" role="radio" aria-checked="false" data-cvd="none">Full color</button>
        <button type="button" id="cvd-protanopia" role="radio" aria-checked="false" data-cvd="protanopia">Protanopia</button>
        <button type="button" id="cvd-deuteranopia" role="radio" aria-checked="false" data-cvd="deuteranopia">Deuteranopia</button>
        <button type="button" id="cvd-tritanopia" role="radio" aria-checked="false" data-cvd="tritanopia">Tritanopia</button>
      </div>
    </div>

    <div class="block">
      <h2>Proof and tokens</h2>
      <div class="btn-grid cols2">
        <button type="button" id="btn-export-json">Proof report JSON</button>
        <button type="button" id="btn-export-css">CSS properties</button>
        <button type="button" id="btn-export-tw">Tailwind config</button>
        <button type="button" id="btn-export-figma">Figma tokens</button>
      </div>
      <p class="note" id="export-note"></p>
    </div>

    <div class="block">
      <button type="button" class="drop" id="drop-zone"><span>Drop an image to extract its palette</span><span class="drop-sub">or click to browse</span></button>
      <input id="file-input" type="file" accept="image/*" hidden>
    </div>
  </section>

  <aside class="palette-col" aria-label="Palette measurements">
    <div class="block">
      <h2>Palette</h2>
      <div id="swatches" class="swatches"></div>
    </div>
    <div class="block">
      <h2>Hue wheel</h2>
      <div id="hue-wheel" class="hue-wheel"></div>
      <p class="note" id="hue-wheel-note"></p>
    </div>
    <div class="block">
      <h2>Contrast matrix</h2>
      <div id="matrix" class="matrix"></div>
      <p class="note" id="matrix-note"></p>
    </div>
    <div class="block" id="test-block" hidden>
      <h2>Self-tests</h2>
      <p class="note" id="test-summary"></p>
      <ul id="test-list" class="test-list"></ul>
    </div>
  </aside>
</main>

<footer class="foot">
  <span class="hash-hint" id="hash-hint">state lives in the URL hash</span>
  <span class="foot-colophon">oklch color science, seeded and deterministic</span>
  <button id="btn-tests" type="button" class="quiet">Run self-tests</button>
</footer>

<div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="app.mjs"></script>
</body>
</html>
